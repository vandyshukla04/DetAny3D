# Wildbox smoke training config -- short fine-tune for pipeline validation.
#
# Mirrors ovmono3d's QUICK_START_SMOKE_TEST.md (2k iters, single-zip-per-species).
# Goal: prove every step (data load -> train -> infer -> export -> ovmono3d eval)
# runs end-to-end. Numbers will be low; that's expected.
#
# DetAny3D trains in epochs, not iters. With ~5-10k smoke samples and per-GPU
# batch=1, ~3 epochs covers the 2k-iter target in ovmono3d. Tune `num_epochs`
# if your smoke dataset size is very different.
#
# Per-architecture deltas vs ovmono3d (consistent with WILDBOX_EXPERIMENT.md
# §20.2 "what you vary across architectures"):
#   - optimizer: AdamW (DetAny3D's choice), not SGD
#   - scheduler: cosine, not multistep
#   - depth supervision DISABLED (synthetic-scale GT; no metric signal)

batch_size: 1
num_epochs: 3
eval_interval: 100000           # disable in-loop eval; eval is a separate pass
inference_only: False
exp_dir: "./exps/wildbox_smoke"
resume: ./checkpoints/detany3d_ckpts/detany3d.pth
resume_scheduler: False
use_amp: True
max_depth: 100

add_cubercnn_for_ap_inference: True
output_json_file: wildbox_smoke_preds

tune_with_prompt: True
inference_with_prompt: True
tune_with_depth: False           # WildBox depth is synthetic per-segment scale
inference_with_depth: True

provide_gt_intrinsics: True
provide_gt_intrinsics_inference: True

# prompts: GT 2D box at training time (no point prompt)
input_point_prompt: False
inference_with_point_prompt: False
input_box_prompt: True
inference_with_box_prompt: True
random_drop_prompt: False
random_drop_prompt_prob: 0.0
random_drop_depth_prompt_prob: 0.0

inference_novel: True
inference_basic: True

output_rotation_matrix: True     # full 3x3 -- aerial drone shots have non-trivial pitch/roll
contain_edge_obj: False

visualize_num: 5

# losses: depth_loss EXCLUDED (synthetic-scale GT). chamfer_loss kept off
# during smoke since it's expensive on CPU and not strictly needed to verify
# the pipeline works.
loss:
  loss_list: ['intrinsic_loss', '2d_bbox_loss', '3d_bbox_loss']
  depth:
    coefficient: 0.15
    depth_loss_weight: 5         # halved (0.5x) -- analog of ovmono3d's LOSS_W_Z=0.5
  phi:
    coefficient: 1
    phi_loss_weight: 2.5
  theta:
    coefficient: 1
    theta_loss_weight: 2.5

unlock_all_backbone: false

load_unidepth_ckpt: True
dino_dim: 1024
unidepth_path: './checkpoints/unidepth_ckpts/model.pth'
dino_path: "./checkpoints/dino_ckpts/dinov2_vitl14_pretrain.pth"

opt:
  type: v3
  learning_rate: 0.00001
  min_learning_rate: 0.000000001
  weight_decay: 0.0000001
  warmup_steps: 100              # short warmup matches the short smoke schedule
  unidepth_lr: 0.0000001
  unidepth_weight_decay: 0.000000001

model:
  type: 'vit_h'
  checkpoint: './checkpoints/sam_ckpts/sam_vit_h_4b8939.pth'
  pad: 896
  image_encoder:
    img_size: 1024
    patch_size: 16
    in_chans: 3
    embed_dim: 1280
    depth: 32
    num_heads: 16
    mlp_ratio: 4.0
    out_chans: 256
    qkv_bias: True
    norm_layer: nn.LayerNorm
    act_layer: nn.GELU
    use_abs_pos: True
    use_rel_pos: True
    rel_pos_zero_init: True
    window_size: 14
    global_attn_indexes: [7, 15, 23, 31]
  prompt_encoder:
  mask_decoder:
    num_multimask_outputs: 3
    type: MaskDecoder
  freeze:
    image_encoder: True          # backbone frozen (ovmono3d analog: DINOv2 frozen)
    prompt_encoder: False
    mask_decoder: False          # 3D heads must adapt to wildlife geometry
  additional_adapter: True
  vit_pad_mask: True
  original_sam: False
  multi_level_box_output: 3

dataset:
  category_meta_path: './data/category_meta_wildbox.json'
  generate_dino_oracle_list: False
  dino_as_input: False
  previous_metric: True
  dino_oracle_input: False
  oracle_2d_input: False         # smoke train uses GT prompts, not oracle
  zero_shot: True                # bypass Omni3D-50 taxonomy filter for unknown dataset_name
  zero_shot_dataset: False       # don't trigger virtual_to_real decode
  clamp_bbox_2d: True
  perturbation_point_prompt: False
  perturbation_box_prompt: True
  perturbation_factor: 0.1       # mild box jitter; rotation_pose remains gt
  num_point_prompts: 1
  generate_point_prompts_via_mask: False
  pixel_mean: [123.675, 116.28, 103.53]
  pixel_std: [58.395, 57.12, 57.375]
  max_dets: 50
  hack_img_path: False
  hack_point_prompt: False
  hack_box_prompt: False
  train:
    wildbox:
      range:
        begin: 0
        end: -1
        interval: 1
      max_distance: 100
      min_distance: 0.01         # synthetic scale: median |z|=1, allow small values
      metric_scale: 1.0
      pkl_path: './data/pkls/wildbox/WildBox_smoke_train.pkl'
  val:
    wildbox:
      range:
        begin: 0
        end: -1
        interval: 1
      max_distance: 100
      min_distance: 0.01
      metric_scale: 1.0
      pkl_path: './data/pkls/wildbox/WildBox_smoke_val.pkl'
