# Wildbox final fine-tune config -- single-seed paper run.
#
# Mirrors ovmono3d's FINAL_RUN.md (15k iters, all 15 zips, 6 species).
# Multi-seed deferred per current scope.
#
# Iter / epoch arithmetic: with ~46k train samples and per-GPU batch=1,
# 1 epoch ~ 46k iters at single-GPU. Multi-GPU (e.g. 8x A40 DDP) divides
# that. ovmono3d's 15k-iter target at batch 8 ~ 120k samples seen ~ 2.6
# epochs over 46k -- so set num_epochs=3 for single-GPU, scale up for
# multi-GPU if needed.

batch_size: 1
num_epochs: 2
eval_interval: 100000
# Save a checkpoint every N iters mid-epoch (defense against SSH-disconnect
# / preemption / NCCL-watchdog kills). End-of-epoch save happens regardless.
# Set to 0 to disable.
save_checkpoint_iters: 5000
inference_only: False
exp_dir: "./exps/wildbox_final"
resume: ./checkpoints/detany3d_ckpts/detany3d.pth
resume_scheduler: False
use_amp: True
max_depth: 100

add_cubercnn_for_ap_inference: True
output_json_file: wildbox_final_preds

tune_with_prompt: True
inference_with_prompt: True
tune_with_depth: False
inference_with_depth: True

provide_gt_intrinsics: True
provide_gt_intrinsics_inference: True

input_point_prompt: False
inference_with_point_prompt: False
input_box_prompt: True
inference_with_box_prompt: True
random_drop_prompt: False
random_drop_prompt_prob: 0.0
random_drop_depth_prompt_prob: 0.0

inference_novel: True
inference_basic: True

output_rotation_matrix: True
contain_edge_obj: False

visualize_num: 10

loss:
  loss_list: ['intrinsic_loss', '2d_bbox_loss', '3d_bbox_loss']
  depth:
    coefficient: 0.15
    depth_loss_weight: 5
  phi:
    coefficient: 1
    phi_loss_weight: 2.5
  theta:
    coefficient: 1
    theta_loss_weight: 2.5

unlock_all_backbone: false

load_unidepth_ckpt: True
dino_dim: 1024
unidepth_path: './checkpoints/unidepth_ckpts/model.pth'
dino_path: "./checkpoints/dino_ckpts/dinov2_vitl14_pretrain.pth"

opt:
  type: v3
  learning_rate: 0.00001
  min_learning_rate: 0.000000001
  weight_decay: 0.0000001
  warmup_steps: 1000
  unidepth_lr: 0.0000001
  unidepth_weight_decay: 0.000000001

model:
  type: 'vit_h'
  checkpoint: './checkpoints/sam_ckpts/sam_vit_h_4b8939.pth'
  pad: 896
  image_encoder:
    img_size: 1024
    patch_size: 16
    in_chans: 3
    embed_dim: 1280
    depth: 32
    num_heads: 16
    mlp_ratio: 4.0
    out_chans: 256
    qkv_bias: True
    norm_layer: nn.LayerNorm
    act_layer: nn.GELU
    use_abs_pos: True
    use_rel_pos: True
    rel_pos_zero_init: True
    window_size: 14
    global_attn_indexes: [7, 15, 23, 31]
  prompt_encoder:
  mask_decoder:
    num_multimask_outputs: 3
    type: MaskDecoder
  freeze:
    image_encoder: True
    prompt_encoder: False
    mask_decoder: False
  additional_adapter: True
  vit_pad_mask: True
  original_sam: False
  multi_level_box_output: 3

dataset:
  category_meta_path: './data/category_meta_wildbox.json'
  generate_dino_oracle_list: False
  dino_as_input: False
  previous_metric: True
  dino_oracle_input: False
  oracle_2d_input: False
  zero_shot: True
  zero_shot_dataset: False
  clamp_bbox_2d: True
  perturbation_point_prompt: False
  perturbation_box_prompt: True
  perturbation_factor: 0.1
  num_point_prompts: 1
  generate_point_prompts_via_mask: False
  pixel_mean: [123.675, 116.28, 103.53]
  pixel_std: [58.395, 57.12, 57.375]
  max_dets: 50
  hack_img_path: False
  hack_point_prompt: False
  hack_box_prompt: False
  train:
    wildbox:
      range:
        begin: 0
        end: -1
        interval: 1
      max_distance: 100
      min_distance: 0.01
      metric_scale: 1.0
      pkl_path: './data/pkls/wildbox/WildBox_train.pkl'
  val:
    wildbox:
      range:
        begin: 0
        end: -1
        interval: 1
      max_distance: 100
      min_distance: 0.01
      metric_scale: 1.0
      pkl_path: './data/pkls/wildbox/WildBox_val.pkl'
